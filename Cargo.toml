[workspace]
resolver = "3"
members = ["crates/palmrest", "crates/palmrest-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/palmrest"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
toml = "1"
notify = "8.2"
# Not in the pinned block: poll, SOCK_SEQPACKET, eventfd, CLOCK_MONOTONIC and the ioctl
# plumbing without libc's unsafe surface. See FINDINGS.
rustix = { version = "1", features = ["event", "fs", "net", "time", "process"] }
# The input service's client (and the wire it speaks, for the kind of device a request names).
# By tag, never by path. Both crates live in the one repository and share one tag.
turnstile-client = { git = "https://github.com/PoHsuanLai/turnstile", tag = "v0.1.1" }
# Who is on the socket: the shell is the one connection that may say the session is unlocked. By tag,
# never by path; `fake` (a held process that is only a claim) only as a dev dependency.
peephole = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.4" }
peephole-core = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.4", features = ["desktop"] }

# A panic in any thread ends the process, so systemd (Restart=on-failure) starts a fresh one
# instead of leaving a daemon whose socket thread is dead.
[profile.release]
panic = "abort"
