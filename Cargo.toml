[workspace]
resolver = "3"
members = ["crates/palmrest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/palmrest"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
