# palmrest: load uinput at boot. The input service (turnstile) makes palmrest's virtual wheel,
# pad and key devices through /dev/uinput, and nothing else loads the module on Ubuntu, Arch or a
# minimal Fedora. turnstile ships the same line; this file is for a machine that runs palmrest
# alone. Install to /etc/modules-load.d/palmrest.conf.
uinput
